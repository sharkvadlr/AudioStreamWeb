<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioStream Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" 
          rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="resources/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-dark bg-dark px-4">
            <a class="navbar-brand text-white" href="#">🎵 AudioStream Web</a>
        </nav>
    </header>

    <main class="container my-4">
        <section class="mb-4 p-4 bg-white rounded shadow-sm text-center">
            <h4 class="mb-1 fw-bold text-dark">Evidencia de Desempeño U2: AudioStream Web</h4>
            <p class="text-secondary mb-2">Asignatura: Aplicaciones Web</p>
            <hr class="my-2">
            <p class="mb-1 fw-bold text-dark">Integrantes del Equipo:</p>
            <p class="mb-0 text-dark">De La Rosa Victor Arturo &bull; Marcos Ortiz Pablo Esau</p>
        </section>

        <section id="reproductor" class="row gx-4">
            <article class="col-5">
                <div class="card p-3 shadow-sm bg-white border-0 h-100 d-flex flex-column justify-content-center">
                    <h4 class="mb-0 text-dark text-start">Reproduciendo</h4>
                    <div class="my-auto text-center py-2">
                        <div class="mb-2">
                            <img id="imagen-cancion" src="" alt="Portada" class="rounded shadow-sm" style="width: 130px; height: 130px; object-fit: cover; display: none;">
                        </div>
                        <div id="info-cancion" class="mb-3">
                            <p class="fw-bold text-dark fs-5" id="titulo">Selecciona una canción</p>
                        </div>
                        
                        <div class="mb-3 px-3">
                            <div class="d-flex justify-content-between text-muted small mb-1">
                                <span id="tiempo-actual">0:00</span>
                                <span id="duracion-total">0:00</span>
                            </div>
                            <input type="range" id="barra-progreso" min="0" max="100" value="0" class="form-range">
                        </div>

                        <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
                            <button id="btn-anterior-reproductor" class="btn btn-outline-primary btn-sm px-3">⏮</button>
                            <button id="btn-play-pause" class="btn btn-success btn-sm px-4">▶</button>
                            <button id="btn-siguiente-reproductor" class="btn btn-outline-primary btn-sm px-3">⏭</button>
                        </div>

                        <div class="d-flex align-items-center justify-content-center gap-2 px-4">
                            <span>🔊</span>
                            <input type="range" id="volumen" min="0" max="1" step="0.01" value="1" class="form-range w-50">
                        </div>

                        <audio id="audio-player" class="d-none"></audio>
                    </div>
                </div>
            </article>

            <article class="col-7">
                <div class="card p-3 shadow-sm bg-white border-0 h-100">
                    <h4 class="mb-3 text-dark">Lista de Reproducción</h4>
                    <ul id="lista-canciones" class="list-group list-group-flush"></ul>
                </div>
            </article>
        </section>

        <div class="text-center mt-4">
            <a href="https://github.com/sharkvadlr/AudioStreamWeb" target="_blank" class="btn btn-dark btn-lg shadow-sm">Enlace de GitHub</a>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 AudioStreamWeb</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="resources/main.js"></script>
</body>
</html>
